name: comprobaciones

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
      - name: Dependencias con el lockfile congelado
        timeout-minutes: 10
        run: nix develop -c bun install --frozen-lockfile
      - name: Comprobación de tipos
        timeout-minutes: 10
        run: nix develop -c bun run typecheck
      - name: Pruebas
        timeout-minutes: 15
        run: nix develop -c bun run test
      - name: El cotejo regenerado desde la extracción sellada coincide con el de git
        timeout-minutes: 5
        run: |
          nix develop -c bun scripts/procedencia.ts cotejar
          git status --porcelain -- procedencia/resultados
          test -z "$(git status --porcelain -- procedencia/resultados)"
