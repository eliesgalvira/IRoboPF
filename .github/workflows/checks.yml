name: Comprobaciones
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rechazar rutas de caché publicadas
        run: timeout -k 30s 1m python3 scripts/ci-no-cache.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: echo "Corpus completo CAS omitido explícitamente; se ejecutan fixtures y contratos reproducibles. Véase docs/procedencia/CI.md"
      - id: dependencies
        run: timeout -k 30s 12m bun install --frozen-lockfile
      - run: timeout -k 30s 12m bun run test:lint
      - run: timeout -k 30s 12m bun run lint
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run typecheck
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test:ci
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test tests/puertos-composicion-r47.test.ts tests/puertos-r52.test.ts --maxWorkers=1
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test tests/cotizaciones-perfil-uniforme.test.ts tests/*-procedencia.test.ts --exclude tests/evidencia-contenido-procedencia.test.ts --maxWorkers=1
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test tests/retenciones-versionadas.test.ts tests/trabajo-anual-contratos.test.ts tests/actividades-economicas-2025.test.ts tests/deducciones-contratos.test.ts tests/deducciones-ambito.test.ts tests/deducciones-conjunta-identidad.test.ts tests/calculo-salario-neto-irpf.test.ts --maxWorkers=1
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test tests/composicion-anual-unica.test.ts tests/composicion-anual-revision.test.ts tests/composicion-precision.test.ts tests/composicion-precision-contraste.test.ts tests/anual-salarial-completo.test.ts tests/anual-historico-explicito.test.ts tests/conexion-anual.test.ts tests/redondeo-salarial-open.test.ts tests/art20-open-c300.test.ts tests/andalucia-open-c300.test.ts tests/c300-variantes-cuotas.test.ts tests/c300-variantes-revision.test.ts tests/retirada-rutas.test.ts tests/motor-unico-revision.test.ts tests/minimos-derechos.test.ts tests/retenciones-derechos.test.ts tests/liquidacion-irpf-anual.test.ts tests/correcciones-x-solidaridad.test.ts --maxWorkers=1
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run inventario:verificar
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test tests/minimos-derechos-anuales.test.ts tests/territorios-2026.test.ts tests/comunidades-autonomas.test.ts tests/deducciones-pendientes.test.ts tests/deducciones-valencianas-datos-producto.test.ts tests/deducciones-valencianas-evaluacion.test.ts tests/deducciones-valencianas-correcciones.test.ts tests/deducciones-valencianas-composicion.test.ts tests/deducciones-valencianas-ejercicio.test.ts tests/deducciones-valencianas-cuota-conjunta.test.ts tests/deducciones-valencianas-anual.test.ts tests/deducciones-territoriales-anual.test.ts tests/deducciones-ampliacion-a-anual.test.ts tests/deducciones-a40-censos-anuales.test.ts tests/b-ampliado-adaptador-anual-2025.test.ts tests/b-conexion-completa-2025.test.ts tests/b37-anual-revision.test.ts tests/aragon-dos-codigos-2025.test.ts tests/revision-aragon-independiente.test.ts tests/deducciones-territoriales-anual-revision.test.ts tests/deducciones-territoriales-api-revision.test.ts tests/deducciones-territoriales-titulares.test.ts tests/deducciones-territoriales-vinculos-contraste.test.ts tests/deducciones-catalunya-hechos-2025.test.ts tests/deducciones-territorial-f-2025.test.ts tests/deducciones-asturias-cantabria-hechos-2025.test.ts tests/deducciones-revision-b-independiente.test.ts tests/deducciones-asturias-cantabria-ampliacion-2025.test.ts tests/deducciones-ampliacion-b-conserva-integrado.test.ts tests/deducciones-ampliacion-b-revision.test.ts tests/deducciones-canarias-balears-hechos-2025.test.ts tests/revision-c-hechos-20261105.test.ts tests/producto-lote-d-hechos.test.ts tests/producto-lote-d-revision-monetaria.test.ts tests/galicia-rioja-hechos-2025.test.ts tests/revision-e-hechos.test.ts tests/deducciones-lote-a-ampliacion-2025.test.ts tests/deducciones-lote-a-ampliacion-revision.test.ts tests/galicia-rioja-ampliacion-2025.test.ts tests/galicia-rioja-ampliacion-revision.test.ts tests/deducciones-d51-correccion.test.ts tests/discriminantes-d51.test.ts tests/producto-lote-d-ampliacion.test.ts tests/deducciones-canarias-balears-ampliacion.test.ts tests/revision-c36-independiente.test.ts tests/escalas-publicadas.test.ts tests/escalas-publicadas-2025.test.ts tests/escalas-madrid-historicas.test.ts --maxWorkers=1
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test:inventario
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun run test --config scripts/procedencia/contenido-vitest.mjs
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun scripts/procedencia/contenido-verificar.mjs --fixture
      - if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: timeout -k 30s 12m bun scripts/procedencia/rastro-verificar.mjs --fixture
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rechazar rutas de caché publicadas
        run: timeout -k 30s 1m python3 scripts/ci-no-cache.py
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - run: echo "Corpus completo CAS omitido explícitamente; se ejecutan fixtures y contratos reproducibles. Véase docs/procedencia/CI.md"
      - run: timeout -k 30s 12m bun install --frozen-lockfile
      - run: timeout -k 30s 12m bash tools/procedencia/run.sh tests/procedencia-corpus_test.py
      - run: timeout -k 30s 12m bash tools/procedencia/run.sh tests/procedencia-enlaces_test.py
      - run: timeout -k 30s 12m bash tools/procedencia/run.sh tests/procedencia-preservacion_test.py
      - run: timeout -k 30s 1m python3 tests/procedencia-deducciones-registro_test.py
      - run: timeout -k 30s 12m bash scripts/procedencia/deducciones-2025/verificar.sh --lotes docs/procedencia/deducciones-2025/lotes --modo completo
      - run: timeout -k 30s 12m bun scripts/procedencia/verificar-enlaces.mjs --fixture
      - run: timeout -k 30s 12m bun run test tests/evidencia-contenido-procedencia.test.ts --maxWorkers=1
      - run: timeout -k 30s 12m bun run test tests/publicacion-evidencia.test.ts --maxWorkers=1
      - run: timeout -k 30s 12m bun tests/cas-local-r27.mjs
      - run: timeout -k 30s 12m nix develop path:tools/procedencia --command bash scripts/ci-datos.sh
      - run: timeout -k 30s 12m nix develop path:tools/procedencia --command bash scripts/ci-simuladores.sh
