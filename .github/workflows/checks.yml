name: Comprobaciones
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - run: bun run test:lint
      - run: bun run lint
      - if: ${{ !cancelled() }}
        run: bun run typecheck
      - if: ${{ !cancelled() }}
        run: bun run test:ci
      - if: ${{ !cancelled() }}
        run: bun run test tests/cotizaciones-perfil-uniforme.test.ts tests/*-procedencia.test.ts --exclude tests/evidencia-contenido-procedencia.test.ts --maxWorkers=1
      - if: ${{ !cancelled() }}
        run: bun run test tests/retenciones-versionadas.test.ts tests/trabajo-anual-contratos.test.ts tests/actividades-economicas-2025.test.ts tests/deducciones-contratos.test.ts tests/deducciones-ambito.test.ts tests/calculo-salario-neto-irpf.test.ts --maxWorkers=1
      - if: ${{ !cancelled() }}
        run: bun run test tests/conexion-anual.test.ts tests/comparativa-inflacion-tabular.test.ts tests/redondeos-legacy-oracle.test.ts tests/correcciones-x-solidaridad.test.ts --maxWorkers=1
      - if: ${{ !cancelled() }}
        run: bun run inventario:verificar
      - if: ${{ !cancelled() }}
        run: bun run test:inventario
      - if: ${{ !cancelled() }}
        run: bun run test --config scripts/procedencia/contenido-vitest.mjs
      - if: ${{ !cancelled() }}
        run: bun scripts/procedencia/contenido-verificar.mjs
      - if: ${{ !cancelled() }}
        run: bun scripts/procedencia/rastro-verificar.mjs
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - run: bash tools/procedencia/run.sh tests/procedencia-corpus_test.py
      - run: bash tools/procedencia/run.sh tests/procedencia-enlaces_test.py
      - run: bash tools/procedencia/run.sh tests/procedencia-preservacion_test.py
      - run: bun scripts/procedencia/verificar-enlaces.mjs
      - run: bun run test tests/evidencia-contenido-procedencia.test.ts --maxWorkers=1
      - run: bun run test tests/publicacion-evidencia.test.ts --maxWorkers=1
